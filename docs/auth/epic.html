<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Back to Between</title>
    <style>
      :root { --blue: #1f3b95; --navy: #14213d; --yellow: #f5b731; --muted: #dce3f7; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--blue);
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      main { max-width: 420px; width: 100%; text-align: center; }
      h1 { font-size: 30px; margin: 0 0 12px; }
      p { font-size: 19px; line-height: 1.5; color: var(--muted); margin: 0 0 28px; }
      a.button {
        display: block;
        min-height: 60px;
        line-height: 60px;
        border-radius: 14px;
        background: var(--yellow);
        color: var(--navy);
        font-size: 21px;
        font-weight: 800;
        text-decoration: none;
      }
      a.button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div id="ok" class="hidden">
        <h1>You're signed in</h1>
        <p>Tap the button to go back to Between.</p>
        <a id="back" class="button" href="#">Return to Between</a>
      </div>
      <div id="bad" class="hidden">
        <h1>Something went wrong</h1>
        <p>This sign-in link is incomplete. Go back to the Between app and try connecting again.</p>
      </div>
    </main>
    <script src="handoff.js"></script>
    <script>
      (function () {
        var target = window.BetweenHandoff.handoffTarget(window.location.search);
        // Remove the code from the address bar and browser history.
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname);
        }
        if (!target) {
          document.getElementById('bad').className = '';
          return;
        }
        document.getElementById('back').setAttribute('href', target);
        document.getElementById('ok').className = '';
        // Try to jump back on our own; Android may require the tap.
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
